<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 72px;
      margin-bottom: 10px;
      color: #ff4d4d;
    }

    p {
      font-size: 20px;
      margin-bottom: 20px;
    }

    a {
      text-decoration: none;
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
    }

    a:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Oops! The page you are looking for cannot be found.</p>
    <a href="/">Return Home</a>
  </div>
</body>
</html>
